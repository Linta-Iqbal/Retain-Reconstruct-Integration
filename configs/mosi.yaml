task:
  type: regression
  primary_metric: weighted_f1

dataset:
  name: mosi
  modalities: [visual, audio, text]

data:
  train_pickle: ${MOSI_ROOT}/train.pkl
  val_pickle: ${MOSI_ROOT}/dev.pkl
  test_pickle: ${MOSI_ROOT}/test.pkl
  feature_bundle: ${MOSI_ROOT}/features.pt
  train_batch_size: 32

model:
  fusion_hidden_dim: 256
  reconstructor_hidden_dim: 256
  gate_hidden_dim: 128
  dropout: 0.2
  visual_input_dim: 20
  audio_input_dim: 5
  visual_hidden_dim: 64
  audio_hidden_dim: 64
  text_feature_dim: 128
  encoder:
    mode: roberta
    model_id: FacebookAI/roberta-base
    freeze: false

training:
  classifier_lr: 0.0002
  reconstructor_lr: 0.0002
  weight_decay: 1.0e-5
  lambda_distribution: 0.1

corruption:
  pairs:
    - [text, visual]
    - [text, audio]
    - [audio, visual]

output:
  checkpoint_dir: checkpoints/mosi
  results_dir: results/mosi

